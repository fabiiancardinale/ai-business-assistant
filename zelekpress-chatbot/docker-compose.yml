services:
  postgres:
    image: pgvector/pgvector:pg16      # Postgres + extensión pgvector (para RAG en fase 7)
    environment:
      POSTGRES_USER: zelekpress
      POSTGRES_PASSWORD: zelekpress
      POSTGRES_DB: zelekpress
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zelekpress"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

  # worker:  (fase posterior — RQ/Celery para RAG y webhooks)
  #   build: ./backend
  #   command: python -m app.worker
  #   env_file: [./backend/.env]
  #   depends_on: [redis, postgres]

volumes:
  pgdata:
