<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Asistente IA</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            width: 420px;
            max-width: 95%;
            height: 650px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #111827;
            color: white;
            padding: 20px;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .chat-header p {
            margin: 5px 0 0;
            font-size: 13px;
            opacity: .7;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 14px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 15px;
            line-height: 1.4;
            font-size: 14px;
        }

        .user .bubble {
            background: #111827;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .assistant .bubble {
            background: #f1f5f9;
            color: #111827;
            border-bottom-left-radius: 4px;
        }

        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #e5e7eb;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 12px;
            outline: none;
        }

        .chat-input button {
            border: none;
            background: #111827;
            color: white;
            padding: 0 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        .chat-input button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .typing {
            font-size: 13px;
            color: #6b7280;
            padding: 5px 0;
        }

    </style>

</head>

<body>

    <div class="chat-container">

        <div class="chat-header">

            <h2>Zelekpress IA</h2>

            <p>
                Asistente virtual
            </p>

        </div>


        <div
            id="messages"
            class="messages"
        >

            <div class="message assistant">

                <div class="bubble">

                    ¡Hola! 👋
                    ¿En qué puedo ayudarte?

                </div>

            </div>

        </div>


        <div class="chat-input">

            <input
                id="messageInput"
                type="text"
                placeholder="Escribe tu mensaje..."
                autocomplete="off"
            >

            <button id="sendButton">
                Enviar
            </button>

        </div>

    </div>


    <script>

        const API_URL =
            "http://127.0.0.1:8000";

        const COMPANY_ID = 1;


        const messages =
            document.getElementById(
                "messages"
            );

        const messageInput =
            document.getElementById(
                "messageInput"
            );

        const sendButton =
            document.getElementById(
                "sendButton"
            );


        let conversationId = null;


        function addMessage(
            text,
            type
        ) {

            const message =
                document.createElement(
                    "div"
                );

            message.className =
                `message ${type}`;


            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "bubble";

            bubble.textContent =
                text;


            message.appendChild(
                bubble
            );


            messages.appendChild(
                message
            );


            messages.scrollTop =
                messages.scrollHeight;

        }


        async function sendMessage() {

            const text =
                messageInput.value.trim();


            if (!text) {
                return;
            }


            addMessage(
                text,
                "user"
            );


            messageInput.value = "";


            sendButton.disabled =
                true;


            const typing =
                document.createElement(
                    "div"
                );

            typing.className =
                "typing";

            typing.textContent =
                "La IA está escribiendo...";


            messages.appendChild(
                typing
            );


            messages.scrollTop =
                messages.scrollHeight;


            try {

                const response =
                    await fetch(
                        `${API_URL}/chat`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    company_id:
                                        COMPANY_ID,

                                    message:
                                        text,

                                    conversation_id:
                                        conversationId

                                })
                        }
                    );


                const data =
                    await response.json();


                typing.remove();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        data.error ||
                        "Error en la IA"
                    );

                }


                conversationId =
                    data.conversation_id;


                addMessage(
                    data.response,
                    "assistant"
                );


            } catch (error) {

                typing.remove();


                console.error(
                    error
                );


                addMessage(
                    "Lo siento, ocurrió un error al procesar tu mensaje.",
                    "assistant"
                );

            } finally {

                sendButton.disabled =
                    false;

                messageInput.focus();

            }

        }


        sendButton.addEventListener(
            "click",
            sendMessage
        );


        messageInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    sendMessage();

                }

            }
        );

    </script>

</body>

</html>
